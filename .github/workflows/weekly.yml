name: Weekly stats

on:
  schedule:
    # Every Saturday 00:00 JST (= Friday 15:00 UTC).
    - cron: "0 15 * * 5"
  workflow_dispatch:
    inputs:
      week_end:
        description: "Optional: rebuild the week ending on this Saturday (YYYY-MM-DD, JST). Leave empty for last week."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: weekly-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aggregate last week from Deadfrag
        env:
          WEEK_END: ${{ github.event.inputs.week_end }}
        run: node scripts/weekly.mjs

      # Only reached when the script succeeded. On failure nothing is
      # committed, so the site keeps the previous week's page and date.
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Weekly stats: $(node -p "require('./data/latest.json').week.start") to $(node -p "require('./data/latest.json').week.end")"
            git push
          fi
