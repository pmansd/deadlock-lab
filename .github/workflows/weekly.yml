name: Weekly stats

on:
  schedule:
    # Every Saturday 00:00 JST (= Friday 15:00 UTC). GitHub sometimes delays
    # or drops scheduled runs, so retry at 02:00 and 05:00 JST; a retry for a
    # week that is already saved finds no changes and commits nothing.
    - cron: "0 15 * * 5"
    - cron: "0 17 * * 5"
    - cron: "0 20 * * 5"
  workflow_dispatch:
    inputs:
      week_end:
        description: "Optional: rebuild the week ending on this Saturday (YYYY-MM-DD, JST). Leave empty for last week."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: weekly-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The two jobs are independent: if one fails, the other's data is still
      # committed, and the failed one keeps its previous week.
      - name: Hero stats (Deadfrag pro & amateur matches)
        id: heroes
        continue-on-error: true
        env:
          WEEK_END: ${{ github.event.inputs.week_end }}
        run: node scripts/weekly.mjs

      - name: Item usage (high-rank ranked matches, Deadlock API)
        id: items
        continue-on-error: true
        env:
          WEEK_END: ${{ github.event.inputs.week_end }}
        run: node scripts/items.mjs

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data items/icons
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Weekly data update (heroes: ${{ steps.heroes.outcome }}, items: ${{ steps.items.outcome }})"
            git push
          fi

      - name: Report failures
        if: steps.heroes.outcome == 'failure' || steps.items.outcome == 'failure'
        run: |
          echo "heroes: ${{ steps.heroes.outcome }}, items: ${{ steps.items.outcome }}"
          exit 1
