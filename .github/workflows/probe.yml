name: probe
on:
  push:
    branches: [probe-api]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS "https://api.deadlock-api.com/v1/assets/items/by-type/upgrade?language=english" -o items.json
          python3 - <<'PY'
          import json,re
          it=[i for i in json.load(open('items.json')) if i.get('shopable')]
          def txt(i):
            parts=[json.dumps(i.get('description'))]
            for s in i.get('tooltip_sections') or []:
              for a in s.get('section_attributes',[]): parts.append(a.get('loc_string') or '')
            return re.sub(r'\s+',' ',re.sub('<[^>]+>','',' '.join(parts)))
          for i in sorted(it,key=lambda x:(x['item_slot_type'],x['item_tier'])):
            t=txt(i)
            if re.search(r'spirit damage|ability damage|abilities deal|deal(ing)? .{0,20}spirit',t,re.I):
              props={k:(v.get('value'),v.get('label')) for k,v in (i.get('properties') or {}).items() if isinstance(v,dict) and v.get('label') and str(v.get('value')) not in ('0','0.0','','-1','-1.0','None')}
              print('##',i['item_slot_type'],'T%d'%i['item_tier'],i['cost'],i['name'],'::',t[:420]); print('   ',json.dumps(props)[:700])
          PY
