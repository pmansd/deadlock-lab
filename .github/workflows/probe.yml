name: probe
on:
  push:
    branches: [probe-api]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A=https://api.deadlock-api.com
          curl -sS "$A/v1/assets/items/by-type/upgrade?language=english" -o items.json
          curl -sS "$A/v1/assets/heroes?language=english&only_active=true" -o heroes.json
          python3 - <<'PY'
          import json,re
          it=[i for i in json.load(open('items.json')) if i.get('shopable')]
          print('== spirit T4 + vitality T2 images')
          for i in it:
            if (i['item_slot_type'],i['item_tier']) in (('spirit',4),('vitality',2),('weapon',2)):
              print(i['item_slot_type'],i['item_tier'],i['name'],'|',(i.get('shop_image') or '').split('/')[-1])
          for n in ("Enchanter's Emblem",):
            i=[x for x in it if x['name']==n][0]
            print('==',n)
            for k,v in (i.get('properties') or {}).items():
              if isinstance(v,dict) and str(v.get('value')) not in ('0','0.0','','None'): print('   ',k,v.get('value'),v.get('label'))
            print('   desc:',re.sub('<[^>]+>','',json.dumps(i.get('description')))[:600])
          h=[x for x in json.load(open('heroes.json')) if x['name']=='Graves'][0]
          print('== Graves item_slot_info'); print(json.dumps(h.get('item_slot_info'))[:3000])
          print('== Graves level_info sample'); li=h.get('level_info'); print(json.dumps(li)[:1500] if li else None)
          print('== standard_level_up_upgrades'); print(json.dumps(h.get('standard_level_up_upgrades'))[:800])
          print('== purchase_bonuses'); print(json.dumps(h.get('purchase_bonuses'))[:3000])
          PY
