name: probe
on:
  push:
    branches: [probe-api]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A=https://api.deadlock-api.com
          curl -sS "$A/v1/assets/items/by-type/upgrade?language=english" -o items.json
          curl -sS "$A/v1/assets/generic-data" -o gd.json
          python3 - <<'PY'
          import json,re
          it=[i for i in json.load(open('items.json')) if i.get('shopable')]
          print('== items with spirit-power-ish properties')
          for i in sorted(it,key=lambda x:(x.get('item_slot_type'),x.get('item_tier'))):
            props=i.get('properties') or {}
            hit={k:(v.get('value'),v.get('label') or v.get('postfix'),v.get('provided_property_type')) for k,v in props.items() if isinstance(v,dict) and re.search(r'TechPower|SpiritPower|Tech_?Power|BonusSpirit|PowerPercent',k,re.I) and str(v.get('value')) not in ('0','0.0','','None')}
            if hit: print(i['item_slot_type'],'T%s'%i['item_tier'],i['cost'],i['name'],'|',hit)
          print('== Recharging Rush / Boundless / Silencer full props')
          for i in it:
            if i['name'] in ('Recharging Rush','Boundless Spirit','Silencer','Echo Shard'):
              print(i['name'],i['item_slot_type'],i['item_tier'],i['cost']); 
              for k,v in (i.get('properties') or {}).items():
                if isinstance(v,dict) and str(v.get('value')) not in ('0','0.0','','None'): print('   ',k,v.get('value'),v.get('label'))
              print('   desc:',re.sub('<[^>]+>','',str(i.get('description')))[:500])
          g=json.load(open('gd.json'))
          def walk(o,p=''):
            if isinstance(o,dict):
              for k,v in o.items(): walk(v,p+'.'+k)
            elif isinstance(o,list):
              if p and re.search(r'invest|bonus|tier|spirit|tech',p,re.I) and len(str(o))<1500: print(p,'=',json.dumps(o)[:1500])
              else:
                for n,v in enumerate(o[:3]): walk(v,p+'[%d]'%n)
            else:
              if re.search(r'invest|spirit|tech',p,re.I): print(p,'=',o)
          print('== generic data (investment-related)'); walk(g)
          PY
